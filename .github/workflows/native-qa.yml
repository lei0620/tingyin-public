name: Public Android native acceptance
on:
  workflow_dispatch:
    inputs:
      voucher:
        description: Disposable QA order only; revoked after acceptance
        required: true
      dav_password:
        description: Temporary synthetic WebDAV fixture password
        required: true
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Mask disposable test inputs
        run: |
          python3 - <<'PY'
          import os,json
          for value in json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs'].values():
              print('::add-mask::'+value)
          PY
      - name: Check public service connectivity
        run: |
          curl -sS -i --max-time 30 https://tingyin-public.0876543.xyz/health | head -c 1200
          curl -sS -i --max-time 30 https://tingyin-public.lei0620.workers.dev/health | head -c 1200
      - name: Download exact signed candidate
        run: python3 qa/download-candidate.py
      - name: Prepare isolated Android 28 device
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tingyin-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tingyin-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$ANDROID_EMULATOR_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --max-time 300 https://dl.google.com/android/repository/emulator-linux_x64-9322596.zip --output "$RUNNER_TEMP/tingyin-emulator.zip"
          unzip -t "$RUNNER_TEMP/tingyin-emulator.zip" >emulator-archive-check.log
          unzip -q -o "$RUNNER_TEMP/tingyin-emulator.zip" -d "$ANDROID_HOME"
          yes | sdkmanager 'system-images;android-28;default;x86_64'  >sdk-install.log 2>&1 || { tail -n 50 sdk-install.log; exit 1; }
          mkdir -p "$ANDROID_AVD_HOME/public-qa.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s/public-qa.avd\ntarget=android-28\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/public-qa.ini"
          cat > "$ANDROID_AVD_HOME/public-qa.avd/config.ini" <<INI
          avd.ini.encoding=UTF-8
          AvdId=public-qa
          abi.type=x86_64
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          image.sysdir.1=$ANDROID_HOME/system-images/android-28/default/x86_64/
          hw.lcd.width=1080
          hw.lcd.height=2400
          hw.lcd.density=420
          hw.ramSize=2048
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.camera.back=none
          hw.camera.front=none
          disk.dataPartition.size=6442450944
          INI
          adb start-server
          acceleration=off
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then acceleration=on; fi
          "$ANDROID_HOME/emulator/emulator" -avd public-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel "$acceleration" -cores 2 -memory 2048 -feature -Vulkan -port 5580 >emulator.log 2>&1 &
          timeout 900s bash -c 'until adb -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do sleep 5; done'
          adb -s emulator-5580 shell input keyevent 82
      - name: Run release application acceptance
        run: python3 qa/run-native.py
      - name: Collect native evidence
        if: always()
        run: |
          mkdir -p native-evidence
          adb devices -l >native-evidence/device-status.txt 2>&1 || true
          timeout 15s adb -s emulator-5580 pull /sdcard/Android/data/icu.lei2025.tingyin.publicapp/files/public-native/. native-evidence/ || true
          timeout 15s adb -s emulator-5580 logcat -d -s AndroidRuntime:E >native-evidence/android-runtime.log || true
          cp emulator.log sdk-install.log native-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-native-evidence
          path: native-evidence/
          retention-days: 7
